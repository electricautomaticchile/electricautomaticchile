name: Web CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA to redeploy for rollback"
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Smoke test
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js &
          echo $! > /tmp/next.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          kill "$(cat /tmp/next.pid)"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout "${{ inputs.rollback_sha }}"
          echo "Rollback candidate checked out: ${{ inputs.rollback_sha }}"
          echo "Connect this step to the web deploy provider CLI using protected environment secrets."
