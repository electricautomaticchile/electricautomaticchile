version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --silent
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
build:
  env:
    variables:
      NODE_VERSION: "20"
      NPM_VERSION: "10"
